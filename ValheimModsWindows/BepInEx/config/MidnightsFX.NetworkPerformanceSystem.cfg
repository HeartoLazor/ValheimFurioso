## Settings file was created by plugin NetworkPerformanceSystem v1.9.0
## Plugin GUID: MidnightsFX.NetworkPerformanceSystem

[Allocation]

## Read a received ZDO's fields directly instead of through the fourteen delegates the game allocates for every single one.
# Setting type: Boolean
# Default value: true
Enable ZDO Deserialize Fast Path = true

## Read each incoming ZDO's payload straight into the buffer that is about to hold it instead of copying twice.
# Setting type: Boolean
# Default value: true
Enable Packet Read Fast Path = true

## Reuse the two packet buffers the send path builds, instead of constructing and discarding both on every send to every peer.
# Setting type: Boolean
# Default value: true
Enable Send Package Reuse = true

## Call an incoming RPC's handler directly when its signature is the common one, instead of going through reflection for every message.
# Setting type: Boolean
# Default value: true
Enable RPC Invoke Fast Path = true

## Write each relayed RPC (footsteps, hits, damage numbers, chat and the rest) once and hand the same bytes to every player it goes to, instead of rebuilding and re-copying the whole message for each one. The bytes sent are identical. Host-side only.
# Setting type: Boolean
# Default value: true
Enable Relay Send Reuse = true

[Client config]

## Enables Debug logging.
# Setting type: Boolean
# Default value: false
EnableDebugMode = false

## Render entities owned by other players at their estimated current position rather than their last-received one. Requires the server to be running this mod.
# Setting type: Boolean
# Default value: true
EnableLatencyCompensation = true

## How much of the measured path latency to correct for. 1.0 corrects fully. Lower values trade accuracy for less overshooting. 0 Disables it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
LatencyCompensationStrength = 1

## How far objects can be displaced through latency compensation.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,5 to 4,5
LatencyCompensationMaxMeters = 3

## Show the per-entity latency compensation overlay (owner, estimated staleness, applied displacement).
# Setting type: Boolean
# Default value: false
EnableDebugOverlay = false

## Warn when the server stops answering, and return to the menu once it is certain. Otherwise you can continue to play on a disconnected world and any changes made would be lost.
# Setting type: Boolean
# Default value: true
EnableGhostWatchdog = true

## When the server turns on monitoring, this allows your client to upload data. As the client, this is your hard-opt out, server can't override it.
# Setting type: Boolean
# Default value: true
AllowMonitoringUpload = true

## Buffers updates that land before their associated receiving RCPs, prevents data loss on connection.
# Setting type: Boolean
# Default value: true
EnableEarlyZdoDataGuard = true

[Compatibility]

## Some mods - ServerSync and every mod that bundles it, ConditionalConfigSync, ServerCharacters, Jotunn - wait for a player's send queue to fall under a fixed 10000-20000 bytes before sending, and disconnect that player after 30 seconds if it never does. This adjusts that to handled changes made by this mod.
# Setting type: Boolean
# Default value: true
Report Vanilla Queue Size = true

Queue Drain Interval Seconds = 8

Queue Drain Floor Bytes = 8192

[Connection Timeout]

## Let this mod set how long a connection may go quiet before either end hangs up, instead of the game's fixed 30 seconds.
# Setting type: Boolean
# Default value: true
Enable Timeout Tuning = true

## How long a connection attempt may take before Steam abandons it, in seconds. 10 is Steam's own default, which the game never changes. This covers only the handshake, before the connection exists.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 5 to 600
Connect Timeout Seconds = 10

## How long an established connection may go without a packet before it is dropped, in seconds. 30 is vanilla. This is the setting for players who get disconnected mid-join or during a hitch on a weak link.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 10 to 600
Connection Timeout Seconds = 30

## The longer allowance the game already gives itself while a crossplay peer is joining and the world is being transferred, in seconds. 90 is vanilla. A slow client can spend minutes here loading on a large world.
# Setting type: Int32
# Default value: 90
# Acceptable value range: From 30 to 900
Loading Timeout Seconds = 90

## Stop giving objects to a player who has stopped answering. A peer that goes quiet keeps its slot for the full 'Connection Timeout Seconds' so it can come back, but the things it was simulating - creatures especially - are handed to players who are actually there.
# Setting type: Boolean
# Default value: true
Evict Ghost Owners = true

## How long a player may be silent before their objects are given to someone else, in seconds. The game pings every peer once a second, so ten seconds is ten missed replies.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 3 to 60
Ghost Owner Evict Seconds = 10

[Monitoring]

## Record what the network is doing to BepInEx/NpsMonitoring, for sending to the mod author with a bug or optimization report.
# Setting type: Boolean
# Default value: false
Enable Network Monitoring = false

## While monitoring is on, also ask every player's game for its network related stats
# Setting type: Boolean
# Default value: true
Collect From Clients = true

## The most each client may send the server in monitoring records, averaged over time. Records beyond it are dropped on the client and counted. Sent in 4KB batches that are held back whenever the client's link to the server is already near its send window, so they never delay the game's own traffic.
# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 256 to 4096
Client Upload Bytes Per Second = 2048

## The most BepInEx/NpsMonitoring may hold, across every session in it. Recording stops when it is reached and says so in the log. Nothing already recorded is ever deleted to make room. Files are compressed as they are closed.
# Setting type: Int32
# Default value: 4096
# Acceptable value range: From 64 to 65536
Max Disk MB = 4096

[Ownership]

## Assign ZDO ownership to minimise how stale the object looks to the players who can actually see it, instead of vanilla's first-peer-wins ordering. This is what makes it 'feel like singleplayer'
# Setting type: Boolean
# Default value: true
Enable Latency-Aware Ownership = true

## Let the host compete for ownership of contested ZDOs in the zones it has loaded. (This is ONLY around spawn by default).
# Setting type: Boolean
# Default value: true
Allow Host As Owner = true

## Minimum time an owner keeps a ZDO before it can be challenged. This prevents constant ZDO change thrash.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 60
Min Hold Seconds = 5

## A challenger must improve estimated staleness by at least this many milliseconds to take ownership.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 0 to 250
Challenge Margin Ms = 25

## Cap on latency-driven ownership transfers of moving objects per arbitration pass (boats, creatures, carts etc). Each transfer costs a ZDO resend.
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 1 to 128
Max Reassigns Per Pass = 8

## Cost added per simulated object (creatures, ships - not walls or trees) a candidate already owns nearby, in milliseconds. This prevents one user from simulating a whole area even if they have the best connection. Low priority objects will be shuffled to others.
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 0,5
Load Penalty Ms = 0.02

## Round-trip time assumed for a peer the host has no measurement for - crossplay/PlayFab connections never report one, and every Steam peer is unmeasured for its first seconds. Such a peer still wins objects only it can see, but loses contested ones to any measured peer with a lower ping. Treating unmeasured as 0ms instead would hand them everything in range.
# Setting type: Int32
# Default value: 150
# Acceptable value range: From 0 to 1000
Unmeasured Peer RTT Ms = 150

## Also place interactable-but-stationary objects - berry bushes and other pickables, ore deposits, rocks, trees, logs and destructibles - on whoever is standing nearest them. This allows most interactables to respond to the user instantly instead of waiting on a delayed RPC.
# Setting type: Boolean
# Default value: true
Interactive Object Ownership = true

## How close a player has to be, in metres, before an interactable object is placed on them.
# Setting type: Single
# Default value: 32
# Acceptable value range: From 4 to 64
Interactive Claim Radius = 32

## How much nearer, in metres, a player must be than the current owner before an interactable object moves to them. This is the distance equivalent of Challenge Margin Ms.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 32
Interactive Challenge Margin = 4

## Minimum time before an interactable object that has changed ownership can change again. Nothing in the game hands these objects over by itself, so there is no player-initiated claim to wait out
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 120
Interactive Min Hold Seconds = 15

## Minimum cap on how many interactable objects may be placed on a nearer player per arbitration pass. It is a separate budget from Max Reassigns Per Pass on purpose, so a zone full of contested creatures cannot starve the handful of moves that make a berry patch local.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 1 to 256
Interactive Max Reassigns Per Pass = 16

## When exactly one player is near a creature, that player owns it, whatever anyone else's latency is. Prevents lag when two players are within network distance but not fighting the same creatures.
# Setting type: Boolean
# Default value: true
Creature Proximity Ownership = true

## How close, in metres, a player has to be to a creature to count as near it for Creature Proximity Ownership. Two players both inside this distance of one creature are sharing a fight; two players further apart than about twice this are not.
# Setting type: Single
# Default value: 48
# Acceptable value range: From 16 to 96
Creature Proximity Radius = 48

## Give creatures first call on ownership arbitration. Game defaults to creatures having low priority for network updates.
# Setting type: Boolean
# Default value: true
Arbitrate Creatures = true

## Prevents previous owners network updates immediately taking an owned object back, and tells that player straight away who owns it now. A creature's movement from its previous owner is dropped rather than shown to everyone else. Disabling this effectively neuters the arbiter.
# Setting type: Boolean
# Default value: true
Reject Stale Owner Updates = true

## Hand a ship to whoever takes its helm, so the player steering simulates it on their own machine instead of watching it relayed through the host from another player.
# Setting type: Boolean
# Default value: true
Ship Ownership Follows Helmsman = true

